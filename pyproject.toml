[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-sentry"
version = "0.2.0"
description = "Cryptographic inventory and post-quantum migration-readiness reporting from source/configuration evidence."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quanta-sentry = "quantasentry.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
